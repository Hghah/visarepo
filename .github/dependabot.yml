version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      nest:
        patterns: ['@nestjs/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', 'eslint-config-next', '@types/react*']
      tooling:
        patterns: ['typescript', 'vitest', '@vitest/*', 'oxlint*', 'eslint', 'prettier', 'tailwindcss', '@tailwindcss/*']
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
