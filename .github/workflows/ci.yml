name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stamped
          POSTGRES_PASSWORD: stamped
          POSTGRES_DB: stamped_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stamped -d stamped_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://stamped:stamped@localhost:5432/stamped_test
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stamped/core build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm format:check
      - run: pnpm -r test
      - name: API end-to-end tests
        run: pnpm --filter @stamped/api test:e2e
      - name: Production builds
        run: pnpm --filter @stamped/api build && pnpm --filter @stamped/web build

  docker:
    name: Docker stack and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack, then run every test inside it
        run: docker compose --profile test run --rm --build test
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-results/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - if: always()
        run: docker compose --profile test down -v

  publish:
    name: Publish images
    needs: [checks, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
